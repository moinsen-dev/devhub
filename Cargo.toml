[package]
name = "devhub"
version = "0.3.0"
edition = "2021"
description = "Multi-project development environment manager"
license = "MIT"
repository = "https://github.com/moinsen-dev/devhub"
keywords = ["development", "proxy", "process-manager", "devtools"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Regex for port detection
regex = "1"

# HTTP server for dashboard API
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Utilities
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
colored = "2"
which = "6"

# Process management
nix = { version = "0.29", features = ["signal", "process"] }

# HTTP client for health checks
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
fuzzy-matcher = "0.3.7"

# Environment file loading
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "devhub"
path = "src/main.rs"
