# DevHub Reverse Proxy
#
# A centralized Caddy reverse proxy that routes *.localhost domains
# to development services managed by DevHub.
#
# SETUP:
#   docker network create shared_proxy   # One-time setup
#   docker compose up -d                 # Start the proxy
#
# ARCHITECTURE:
#   Browser → http://myapp.localhost:80
#           ↓
#   Caddy Proxy (this container)
#           ↓
#   Host Service via host.docker.internal:PORT

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # Allow Caddy to reach services running on the host machine
      # Works on macOS, Windows, and Linux (Docker 20.10+)
      - "host.docker.internal:host-gateway"
    volumes:
      # Main Caddyfile configuration
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Project-specific site configurations (auto-generated by DevHub)
      - ./sites.d:/etc/caddy/sites.d:ro
      # Persistent storage for certificates and config
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - shared_proxy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  shared_proxy:
    # Use existing network - create with: docker network create shared_proxy
    # This allows other Docker containers to attach and be proxied too
    external: true
